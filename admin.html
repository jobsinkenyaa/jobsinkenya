<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial;
background:#f3f4f6;
padding:40px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border:1px solid #ddd;
border-radius:6px;
}

button{
margin-top:15px;
background:#16a34a;
color:white;
border:none;
padding:12px;
border-radius:6px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Post Job</h2>

<input id="title" placeholder="Job Title">

<input id="company" placeholder="Company">

<input id="location" placeholder="Location">

<input id="deadline" placeholder="Deadline">

<input id="apply" placeholder="Application Email or Link">

<textarea id="description" placeholder="Full Job Description"></textarea>

<button onclick="postJob()">Publish Job</button>

</div>

<script>

const repo="YOUR_USERNAME/YOUR_REPO";
const token="YOUR_GITHUB_TOKEN";

async function postJob(){

const job={

title:document.getElementById("title").value,
company:document.getElementById("company").value,
location:document.getElementById("location").value,
deadline:document.getElementById("deadline").value,
apply:document.getElementById("apply").value,
description:document.getElementById("description").value,
date:new Date().toISOString()

};

const url=`https://api.github.com/repos/${repo}/contents/jobs.json`;

const file=await fetch(url);
const data=await file.json();

const jobs=JSON.parse(atob(data.content));

jobs.push(job);

const updated=btoa(JSON.stringify(jobs,null,2));

await fetch(url,{
method:"PUT",
headers:{
Authorization:"token "+token,
"Content-Type":"application/json"
},
body:JSON.stringify({
message:"New job added",
content:updated,
sha:data.sha
})
});

alert("Job posted successfully");

}

</script>

</body>
</html>
